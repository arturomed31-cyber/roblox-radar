name: Player readings (every 30 min)

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min; the Cloudflare Worker cron dispatches too (GitHub often skips)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  readings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # the runner's own python3 is enough (standard library only) and saves the setup step
      - name: Read player counts
        run: python3 scripts/update.py --light

      - name: Discord alerts
        run: python3 scripts/alerts.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true

      - name: Commit reading
        run: |
          git config user.name "roblox-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/h data/trends.json data/alerts_state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: reading $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main
            git push
          fi
