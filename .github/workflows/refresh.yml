name: Player readings (every 2h)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  readings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read player counts
        run: python scripts/update.py --light

      - name: Discord alerts
        run: python scripts/alerts.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true

      - name: Commit reading
        run: |
          git config user.name "roblox-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json data/history.json data/alerts_state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: reading $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main
            git push
          fi
