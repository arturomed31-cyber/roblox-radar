<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Radar</title>
<meta name="description" content="Every Roblox game holding 1,000+ concurrent players, tagged by category and copy pattern, with daily player history.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="i18n.js"></script>
<script src="i18n_more.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0e1015; --panel:#171a22; --panel-2:#1e222c; --panel-3:#252a36;
  --border:#2a2f3b; --text:#e7e9f0; --text-dim:#9599a8; --text-faint:#666c7c;
  --accent:#4fd1c5; --accent-dim:#27524e; --accent-text:#04201d;
  --good:#5fd77c; --warn:#f0b429; --risk:#ef6461; --chip:#333a49;
  --shadow:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eaecf1; --panel-3:#e0e3ea;
    --border:#d8dbe3; --text:#161922; --text-dim:#565c6e; --text-faint:#868c9c;
    --accent:#0d7d74; --accent-dim:#cbeae6; --accent-text:#ffffff;
    --good:#1c8f45; --warn:#9a6300; --risk:#bf372e; --chip:#e3e6ed;
    --shadow:rgba(20,25,40,.22);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eaecf1; --panel-3:#e0e3ea;
  --border:#d8dbe3; --text:#161922; --text-dim:#565c6e; --text-faint:#868c9c;
  --accent:#0d7d74; --accent-dim:#cbeae6; --accent-text:#ffffff;
  --good:#1c8f45; --warn:#9a6300; --risk:#bf372e; --chip:#e3e6ed;
  --shadow:rgba(20,25,40,.22);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1015; --panel:#171a22; --panel-2:#1e222c; --panel-3:#252a36;
  --border:#2a2f3b; --text:#e7e9f0; --text-dim:#9599a8; --text-faint:#666c7c;
  --accent:#4fd1c5; --accent-dim:#27524e; --accent-text:#04201d;
  --good:#5fd77c; --warn:#f0b429; --risk:#ef6461; --chip:#333a49;
  --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;scrollbar-color:var(--panel-3) var(--bg);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
.table-scroll::-webkit-scrollbar-track,.overlay::-webkit-scrollbar-track{background:var(--panel);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Public Sans',system-ui,-apple-system,sans-serif;
  padding-block:22px 64px; padding-left:16px; padding-right:16px;
}
.wrap{max-width:1240px;margin:0 auto;}

header{
  display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;
}
h1{
  font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.015em;font-size:clamp(30px,5vw,44px);margin:0;line-height:.92;text-wrap:balance;
}
.sub{color:var(--text-dim);font-size:13.5px;margin-top:7px;max-width:62ch;}
.scan-meta{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;color:var(--text-faint);text-align:right;line-height:1.65;}
.scan-meta b{color:var(--accent);font-weight:600;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:8px;font-weight:600;}

.signals{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px;
}
.signal{background:var(--panel);padding:11px 13px;cursor:pointer;user-select:none;transition:background .12s;border:none;text-align:left;font-family:inherit;color:inherit;width:100%;}
.signal:hover{background:var(--panel-2);}
.signal.active{background:var(--accent-dim);}
.signal:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.signal .n{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
.signal .lbl{font-size:11.5px;color:var(--text-dim);margin-top:5px;}
.signal.risk .n{color:var(--risk);} .signal.warn .n{color:var(--warn);}
.signal.good .n{color:var(--good);} .signal.info .n{color:var(--accent);}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding:11px 13px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
#search{flex:1 1 210px;min-width:150px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-family:inherit;font-size:13.5px;}
select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:7px;font-family:inherit;font-size:13px;}
#search:focus,select:focus,.chip:focus-visible,.clear-btn:focus-visible,.more-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);cursor:pointer;white-space:nowrap;}
.chip:hover{border-color:var(--accent);color:var(--text);}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600;}
.clear-btn{font-size:12.5px;color:var(--text-dim);background:none;border:1px solid var(--border);padding:8px 12px;border-radius:7px;cursor:pointer;font-family:inherit;}
.clear-btn:hover{color:var(--text);border-color:var(--text-faint);}
.count-row{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint);margin-bottom:9px;}

.table-scroll{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--panel);max-height:74vh;}
table{border-collapse:collapse;width:100%;min-width:900px;}
thead th{position:sticky;top:0;z-index:1;background:var(--panel-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th.sortable{cursor:pointer;}
thead th.sortable:hover{color:var(--text);}
thead th.sorted{color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--panel-2);}
td{padding:8px 12px;font-size:13px;vertical-align:middle;}

.game-cell{display:flex;align-items:center;gap:10px;}
.thumb-btn{
  padding:0;border:1px solid var(--border);background:var(--panel-2);border-radius:8px;
  width:44px;height:44px;flex-shrink:0;cursor:pointer;overflow:hidden;line-height:0;position:relative;
}
.thumb-btn:hover{border-color:var(--accent);}
.thumb-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.sprite{display:block;background-image:url("icons.jpg");background-repeat:no-repeat;}
.thumb-btn .sprite{width:44px;height:44px;}
.game-text{min-width:0;}
.game-name{font-weight:600;font-size:13.5px;display:block;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:none;padding:0;color:var(--text);font-family:inherit;cursor:pointer;text-align:left;}
.game-name:hover{color:var(--accent);}
.creator{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);display:block;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--text-dim);white-space:nowrap;display:inline-block;}
.cat-pill .auto{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-faint);letter-spacing:.04em;margin-left:3px;}
.tagset{display:flex;flex-wrap:wrap;gap:4px;max-width:290px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2.5px 7px;border-radius:5px;white-space:nowrap;border:1px solid transparent;}
.tag.risk{background:color-mix(in srgb,var(--risk) 15%,transparent);color:var(--risk);border-color:color-mix(in srgb,var(--risk) 32%,transparent);}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);}
.tag.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 32%,transparent);}
.tag.info{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);}
.tag.none{color:var(--text-faint);}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.rating{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.rating.hi{color:var(--good);} .rating.mid{color:var(--warn);} .rating.lo{color:var(--risk);}
.age{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--text-dim);white-space:nowrap;}
.age.fresh{color:var(--accent);}
.empty-state{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;}
.more-row{display:flex;justify-content:center;padding:14px;}
.more-btn{font-family:inherit;font-size:13px;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 18px;cursor:pointer;}
.more-btn:hover{border-color:var(--accent);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50;}
.overlay[hidden]{display:none;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:760px;width:100%;box-shadow:0 24px 60px var(--shadow);overflow:hidden;}
.modal-hero{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--panel-2);overflow:hidden;}
.modal-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.modal-hero.icon-only{display:flex;align-items:center;justify-content:center;aspect-ratio:16/7;background:radial-gradient(ellipse at center,var(--panel-3),var(--panel-2));}
.modal-hero.icon-only .sprite{width:144px;height:144px;border-radius:18px;box-shadow:0 12px 32px var(--shadow);}
.modal-hero .fade{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,var(--panel),transparent);}
.modal-close{position:absolute;top:10px;right:10px;background:rgba(10,12,18,.72);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;font-size:17px;line-height:1;cursor:pointer;}
.modal-close:hover{background:rgba(10,12,18,.92);}
.modal-body{padding:16px 20px 22px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1.05;margin:0 0 4px;text-transform:uppercase;text-wrap:balance;}
.modal-creator{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);margin-bottom:12px;}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:18px;}
.stat{background:var(--panel-2);padding:10px 12px;min-width:0;}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25;}
.stat .k{font-size:10.5px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
.chart-box{border:1px solid var(--border);border-radius:10px;padding:12px 14px 8px;margin-bottom:18px;background:var(--panel-2);}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
.chart-head .t{font-size:12px;font-weight:600;}
.range-bar{display:flex;gap:2px;background:var(--panel-3);border-radius:7px;padding:2px;}
.range-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;border-radius:5px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;}
.range-btn:hover:not(:disabled){color:var(--text);}
.range-btn.on{background:var(--panel);color:var(--accent);font-weight:600;}
.range-btn:disabled{color:var(--text-faint);cursor:not-allowed;opacity:.55;}
.range-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.chart-stats{display:flex;flex-wrap:wrap;gap:14px 22px;margin:4px 0 8px;}
.chart-stats div{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
.chart-stats b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
.chart-stats b.peak{color:var(--accent);}
.chart-wrap{position:relative;}
.chart-wrap svg{display:block;width:100%;height:auto;max-width:100%;}
.chart-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;box-shadow:0 6px 18px var(--shadow);white-space:nowrap;transform:translate(-50%,-110%);}
.chart-tip[hidden]{display:none;}
.chart-tip b{color:var(--accent);font-weight:600;}
.chart-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
.chart-empty{font-size:12px;color:var(--text-faint);padding:12px 0;}
.note-form{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px;box-shadow:0 8px 22px var(--shadow);display:flex;gap:6px;align-items:center;max-width:calc(100% - 16px);}
.note-form input{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:12.5px;width:220px;max-width:50vw;}
.note-form input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.note-form button{font-family:inherit;font-size:12px;border-radius:6px;padding:6px 10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;}
.note-form button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600;}
.note-form .when{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);white-space:nowrap;}
.notes-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.note-item{display:flex;align-items:center;gap:10px;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--border);}
.note-item .when{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--warn);white-space:nowrap;}
.note-item .txt{flex:1;min-width:0;overflow-wrap:anywhere;}
.note-item .shared{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-faint);}
.note-item button{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:5px;font-size:11px;padding:3px 7px;cursor:pointer;font-family:inherit;}
.note-item button:hover{color:var(--text);border-color:var(--text-faint);}
.notes-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.notes-head .t{font-size:12px;font-weight:600;}
.notes-head .tools{display:flex;gap:6px;}
.notes-head .tools button,.notes-head .tools label{font-family:inherit;font-size:11px;border-radius:6px;padding:4px 9px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;}
.notes-head .tools button:hover,.notes-head .tools label:hover{color:var(--text);border-color:var(--text-faint);}
.notes-hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:6px;}
.chart-wrap svg{cursor:crosshair;}
.marker{cursor:pointer;}
.links-row{display:flex;flex-wrap:wrap;gap:8px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 13px;border-radius:8px;text-decoration:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text);}
.link-btn:hover{border-color:var(--accent);color:var(--accent);}
.link-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600;}
.link-btn.primary:hover{color:var(--accent-text);opacity:.9;}
.no-socials{font-size:12px;color:var(--text-faint);margin-top:10px;}

/* ---------- settings ---------- */
.header-right{display:flex;align-items:flex-end;gap:14px;}
.gear-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.gear-btn:hover{color:var(--text);border-color:var(--accent);}
.gear-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.gear-btn svg{width:18px;height:18px;}
.settings{max-width:440px;}
.settings-body{padding:18px 20px 20px;}
.settings-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
.settings-title button{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:7px;width:30px;height:30px;font-size:16px;cursor:pointer;}
.settings-title button:hover{color:var(--text);border-color:var(--text-faint);}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--border);}
.setting:first-of-type{border-top:none;}
.setting .lbl{font-size:13px;}
.setting .hint{display:block;font-size:11px;color:var(--text-faint);margin-top:2px;}
.seg{display:flex;gap:2px;background:var(--panel-3);border-radius:7px;padding:2px;flex-shrink:0;}
.seg button{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 9px;border-radius:5px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;}
.seg button.on{background:var(--panel);color:var(--accent);font-weight:600;}
.seg button:hover:not(.on){color:var(--text);}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.switch{position:relative;width:40px;height:22px;border-radius:99px;background:var(--panel-3);border:1px solid var(--border);cursor:pointer;flex-shrink:0;padding:0;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .15s,background .15s;}
.switch[aria-checked="true"]{background:var(--accent-dim);border-color:var(--accent);}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent);}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.settings-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--text-faint);}
.settings-foot button{font-family:inherit;font-size:12px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer;}
.settings-foot button:hover{color:var(--text);}
.setting.stack{flex-direction:column;align-items:stretch;gap:8px;}
.lang-dd{position:relative;}
.lang-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:12.5px;padding:6px 10px 6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;min-width:150px;justify-content:space-between;}
.lang-btn:hover{border-color:var(--accent);}
.lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.lang-btn .chev{width:14px;height:14px;color:var(--text-dim);transition:transform .15s;}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg);}
.lang-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 28px var(--shadow);padding:4px;min-width:180px;max-height:280px;overflow-y:auto;}
.lang-menu[hidden]{display:none;}
.lang-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;font-size:12.5px;padding:7px 9px;border-radius:6px;border:none;background:none;color:var(--text);cursor:pointer;}
.lang-item:hover,.lang-item:focus-visible{background:var(--panel-2);outline:none;}
.lang-item.on{color:var(--accent);font-weight:600;}
.lang-item .check{margin-left:auto;font-size:11px;}

.disclaimer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 13px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:9px;margin-bottom:16px;font-size:12.5px;color:var(--text);}
.disclaimer[hidden]{display:none;}
.disclaimer .ic{color:var(--warn);font-weight:700;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
.disclaimer .tx{flex:1;min-width:200px;}
.disclaimer button{font-family:inherit;font-size:11.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;}
.disclaimer button:hover{color:var(--text);border-color:var(--text-faint);}
.footer-dc{margin-top:6px;color:var(--warn);}
.col-chips{display:flex;flex-wrap:wrap;gap:6px;}
.col-chips .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.settings-body{max-height:85vh;overflow-y:auto;}
.legal{max-width:720px;}
.legal-body{padding:18px 22px 24px;max-height:85vh;overflow-y:auto;font-size:13.5px;line-height:1.6;}
.legal-body h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;margin:18px 0 6px;letter-spacing:.02em;}
.legal-body h3:first-of-type{margin-top:4px;}
.legal-body p{margin:0 0 10px;color:var(--text-dim);}
.legal-body p b{color:var(--text);}
.legal-body ul{margin:0 0 10px 18px;padding:0;color:var(--text-dim);}

.legal-body a{color:var(--accent);}
.legal-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:14px;}
footer .legal-links{margin-top:8px;}
footer .legal-links button{background:none;border:none;color:var(--accent);font-family:inherit;font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;}
footer .legal-links button:hover{color:var(--text);}

/* ---------- views, trends, score, market ---------- */
.view-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.view-switch{display:flex;gap:2px;background:var(--panel-3);border-radius:8px;padding:2px;}
.view-switch button{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;}
.view-switch button.on{background:var(--panel);color:var(--accent);}
.view-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.delta{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.delta.up{color:var(--good);} .delta.down{color:var(--risk);} .delta.flat{color:var(--text-dim);} .delta.na{color:var(--text-faint);}
.score-pill{display:inline-block;min-width:38px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;padding:3px 7px;border-radius:6px;border:1px solid transparent;}
.score-pill.s4{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent);}
.score-pill.s3{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 32%,transparent);}
.score-pill.s2{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);}
.score-pill.s1{background:color-mix(in srgb,var(--risk) 14%,transparent);color:var(--risk);border-color:color-mix(in srgb,var(--risk) 30%,transparent);}
.trend-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:5px;white-space:nowrap;}
.trend-badge.rising{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
.trend-badge.falling{background:color-mix(in srgb,var(--risk) 16%,transparent);color:var(--risk);}
.trend-badge.flat{background:var(--chip);color:var(--text-dim);}
.trend-badge.new{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);}
.score-box{border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:18px;background:var(--panel-2);}
.score-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.score-big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1;}
.score-head .t{font-size:12px;font-weight:600;}
.score-head .hint{font-size:11px;color:var(--text-faint);}
.score-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;}
.score-part{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--text-dim);border-bottom:1px dashed var(--border);padding:4px 0;}
.score-part b{color:var(--text);font-variant-numeric:tabular-nums;}
.score-part b.neg{color:var(--risk);} .score-part b.pos{color:var(--good);}
.trend-row{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:16px;}
.trend-row div{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);}
.trend-row b{font-variant-numeric:tabular-nums;}
.market-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--panel);}
.market-wrap table{min-width:820px;}
.market-wrap tbody tr{cursor:pointer;}
.market-name{font-weight:600;}
.market-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);}
.bar{position:relative;height:6px;background:var(--panel-3);border-radius:3px;min-width:70px;overflow:hidden;}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;}
.market-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin:10px 0 0;line-height:1.6;}
.market-group{padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);background:var(--panel-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

footer{margin-top:20px;font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;line-height:1.7;max-width:100ch;}

<script>
let DATA = null, GAMES = [], SAMPLE_TIMES = [], SAMPLE_MS = [];

/* ---------- i18n ---------- */
/* I18N dictionaries live in i18n.js */
function t(key){ const d = I18N[settings.lang] || I18N.en; return d[key] ?? I18N.en[key] ?? key; }
const TAG_CLS = {'brainrot':'warn','mm2-clone':'risk','mm2-original':'good','minecraft-clone':'risk','tower':'info','tower-defense':'info','steal-pattern':'warn','plus1-pattern':'warn','duels-pattern':'warn','rng-gacha':'info','copycat':'risk','licensed-ip':'risk','flagship':'good','anime':'info','meme':'warn'};
const SIGNAL_DEFS = [
  {key:'brainrot',tone:'warn'},{key:'mm2-clone',tone:'risk'},{key:'minecraft-clone',tone:'risk'},{key:'tower',tone:'info'},
  {key:'steal-pattern',tone:'warn'},{key:'plus1-pattern',tone:'warn'},{key:'duels-pattern',tone:'warn'},
  {key:'copycat',tone:'risk'},{key:'licensed-ip',tone:'risk'},{key:'flagship',tone:'good'}
];
const catLabel = c => t('cats')[c] || c;
const tagLabel = k => t('tags')[k] || k;

/* ---------- settings (per browser) ---------- */
const SETTINGS_KEY = 'radar.settings.v2';
const FILTERS_KEY = 'radar.filters.v1';
const DEFAULT_SETTINGS = {
  lang: (() => { const l = (navigator.language || 'en').toLowerCase().slice(0,2); return (I18N.LANGS || []).some(x => x.code === l) ? l : 'en'; })(),
  theme:'system', numbers:'compact', rows:'150', hideAuto:false, tz:'local',
  minPlayers:'0', rememberFilters:false,
  cols:{score:true, d7:true, d30:false, d1:false, rating:true, visits:true, age:true, favs:false, vpd:false, upd:false, rev:false, members:false, passes:false}
};
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
  Object.assign(settings, saved);
  settings.cols = {...DEFAULT_SETTINGS.cols, ...(saved.cols || {})};
} catch (e) {}
function saveSettings(){ try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }
let PAGE = settings.rows === 'all' ? Infinity : Number(settings.rows) || 150;
function applyTheme(){
  const root = document.documentElement;
  if(settings.theme === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', settings.theme);
}
applyTheme();

const defaultState = () => ({search:'', cat:'', age:'', trend:'', owner:'', tags:new Set(), sort:'playing_desc', shown:PAGE});
let state = defaultState();
let view = 'games', marketBy = 'tags';

function saveFilters(){
  if(!settings.rememberFilters) return;
  try { localStorage.setItem(FILTERS_KEY, JSON.stringify({search:state.search, cat:state.cat, age:state.age, trend:state.trend, owner:state.owner, tags:[...state.tags], sort:state.sort})); } catch (e) {}
}
function loadFilters(){
  if(!settings.rememberFilters) return;
  try {
    const f = JSON.parse(localStorage.getItem(FILTERS_KEY) || 'null');
    if(!f) return;
    state.search = f.search || ''; state.cat = f.cat || ''; state.age = f.age || ''; state.trend = f.trend || ''; state.owner = f.owner || '';
    state.tags = new Set(f.tags || []); state.sort = f.sort || 'playing_desc';
  } catch (e) {}
}

function indexGames(){
  GAMES.forEach((g,i) => { g._i = i; });
  [...GAMES].sort((a,b)=>(b.playing||0)-(a.playing||0)).forEach((g,i)=>{ g._rank = i+1; });
  SAMPLE_MS = SAMPLE_TIMES.map(x => new Date(x).getTime());
  computeMetrics();
}

/* ---------- trends + opportunity score ---------- */
const SATURATED = ['plus1-pattern','steal-pattern','duels-pattern'];
function changeOver(series, days){
  // % change between the latest reading and a reading ~`days` ago taken at a similar
  // time of day (±3h), so a Friday-night vs Saturday-afternoon pair never counts as growth.
  if(series.length < 2) return null;
  const last = series[series.length-1];
  const target = last.t - days*86400e3, minBack = last.t - days*86400e3*0.7;
  const tod = ms => ms % 86400e3;
  const todDiff = (a, b) => { const d = Math.abs(tod(a) - tod(b)); return Math.min(d, 86400e3 - d); };
  let best = null;
  for(const p of series){
    if(p.t > minBack) break;
    if(todDiff(p.t, last.t) > 3*3600e3) continue;
    if(!best || Math.abs(p.t - target) < Math.abs(best.t - target)) best = p;
  }
  if(!best || !best.v) return null;
  return (last.v - best.v) / best.v * 100;
}
const clamp01 = v => Math.max(0, Math.min(1, v));
function computeMetrics(){
  const maxLog = Math.log10(300000), minLog = Math.log10(200);
  GAMES.forEach(g => {
    const s = seriesFor(g);
    g.d1 = changeOver(s, 1); g.d7 = changeOver(s, 7); g.d30 = changeOver(s, 30);
    const mom = g.d7;
    g.trend = g.age != null && g.age < 30 ? 'new' : mom == null ? null : mom >= 15 ? 'rising' : mom <= -15 ? 'falling' : 'flat';

    const parts = [];
    const momScore = mom == null ? 0.5 : clamp01((mom + 50) / 100);       // -50%..+50% -> 0..1
    parts.push(['sc_momentum', Math.round(momScore * 35), 35, mom == null]);
    parts.push(['sc_rating', g.like == null ? 8 : Math.round(clamp01((g.like - 70) / 27) * 20), 20, false]);
    const sc = g.playing ? clamp01((Math.log10(g.playing) - minLog) / (maxLog - minLog)) : 0;
    parts.push(['sc_scale', Math.round(sc * 15), 15, false]);
    const fresh = g.age == null ? 0.3 : g.age < 60 ? 1 : g.age < 180 ? 0.8 : g.age < 365 ? 0.55 : g.age < 730 ? 0.35 : 0.2;
    parts.push(['sc_fresh', Math.round(fresh * 15), 15, false]);
    const eng = g.vpd && g.playing ? clamp01((g.vpd / g.playing - 5) / 60) : 0.3;
    parts.push(['sc_engage', Math.round(eng * 15), 15, false]);
    // business estimates (rough, see bz_note)
    const last24 = s.length ? s.filter(p => p.t >= s[s.length-1].t - 86400e3) : [];
    const avgCcu = last24.length >= 3 ? last24.reduce((a,p) => a + p.v, 0) / last24.length : (g.playing || 0);
    g.dau = avgCcu ? Math.round(avgCcu * 12) : null;
    let monet = 1;
    if(g.gp){ monet = g.gp.n === 0 ? 0.5 : (g.gp.n >= 8 || (g.gp.max || 0) >= 500) ? 1.3 : 1; }
    g.revLow = avgCcu ? Math.round(avgCcu * 6 * monet) : null;
    g.revHigh = avgCcu ? Math.round(avgCcu * 18 * monet) : null;
    g.rev = avgCcu ? Math.round((g.revLow + g.revHigh) / 2) : null;
    g.members = g.grp ? g.grp.m : null;
    g.passes = g.gp ? g.gp.n : null;
    let adj = 0;
    if(g.cType === 'Group') { parts.push(['sc_group', 4, 0, false]); adj += 4; }
    if(g.tags.includes('flagship')) { parts.push(['sc_flagship', 8, 0, false]); adj += 8; }
    if(g.tags.includes('copycat')) { parts.push(['sc_copycat', -10, 0, false]); adj -= 10; }
    if(g.tags.includes('licensed-ip')) { parts.push(['sc_ip', -12, 0, false]); adj -= 12; }
    if(g.tags.some(x => SATURATED.includes(x))) { parts.push(['sc_pattern', -8, 0, false]); adj -= 8; }
    if(g.src !== 'review') { parts.push(['sc_auto', -3, 0, false]); adj -= 3; }
    const base = parts.filter(p => p[2] > 0).reduce((a,p) => a + p[1], 0);
    g.score = Math.max(0, Math.min(100, base + adj));
    g.scoreParts = parts;
  });
}
function scoreClass(s){ return s >= 70 ? 's4' : s >= 55 ? 's3' : s >= 40 ? 's2' : 's1'; }
function fmtPct(v){
  if(v == null) return '—';

}
function deltaHtml(v){

/* ---------- formatting ---------- */
function fmtNum(n){
  if(n == null) return '—';
  if(n >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return String(n);
}
const LOCALES = {en:'en-US', es:'es-ES', pt:'pt-BR', fr:'fr-FR', de:'de-DE', it:'it-IT', ru:'ru-RU', ja:'ja-JP'};
function fmtFull(n){ return n == null ? '—' : n.toLocaleString(LOCALES[settings.lang] || 'en-US'); }

function fmtAge(d){

}
function fmtUpd(d){ return d == null ? '—' : d === 0 ? t('today') : t('daysAgo')(d); }
function ratingClass(p){ return p == null ? '' : p >= 92 ? 'hi' : p >= 82 ? 'mid' : 'lo'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tagHtml(k){ return `<span class="tag ${TAG_CLS[k] || 'info'}">${tagLabel(k)}</span>`; }

function applyFilters(){
  let rows = GAMES;
  const minP = Number(settings.minPlayers) || 0;
  if(minP) rows = rows.filter(g => (g.playing||0) >= minP);
  if(state.search){
    const q = state.search.toLowerCase();
    rows = rows.filter(g => g.name.toLowerCase().includes(q) || (g.creator||'').toLowerCase().includes(q));
  }
  if(state.cat) rows = rows.filter(g => g.cat === state.cat);
  if(state.age){
    rows = state.age === 'old'
      ? rows.filter(g => g.age != null && g.age >= 365)
      : rows.filter(g => g.age != null && g.age < Number(state.age));
  }
  if(state.tags.size) rows = rows.filter(g => [...state.tags].every(x => g.tags.includes(x)));
  if(state.trend) rows = rows.filter(g => g.trend === state.trend);
  if(state.owner) rows = rows.filter(g => g.cType === state.owner);
  if(settings.hideAuto) rows = rows.filter(g => g.src === 'review');
  const [field, dir] = state.sort.split('_');
  return [...rows].sort((a,b) => {
    if(field === 'name'){
      const r = a.name.toLowerCase().localeCompare(b.name.toLowerCase());
      return dir === 'asc' ? r : -r;
    }
    const miss = dir === 'asc' ? Infinity : -Infinity;
    const av = a[field] ?? miss, bv = b[field] ?? miss;
    return dir === 'asc' ? av - bv : bv - av;
  });
}

/* ---------- chart notes (per browser + shared data/notes.json) ---------- */
const NOTES_KEY = 'radar.notes.v1';
let NOTES = {};          // {gameId: [{id, t, text}]}
let SHARED_NOTES = {};   // read-only, from data/notes.json
try { NOTES = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch (e) { NOTES = {}; }
function saveNotes(){ try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (e) {} }
function notesFor(g){
  const own = (NOTES[g.id] || []).map(n => ({...n, shared:false}));
  const sh = (SHARED_NOTES[g.id] || []).map(n => ({...n, shared:true}));
  return own.concat(sh).sort((a,b) => a.t - b.t);
}
function addNote(g, t, text){
  const list = NOTES[g.id] || (NOTES[g.id] = []);
  list.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), t, text});
  saveNotes();
}
function updateNote(g, id, text){
  const n = (NOTES[g.id] || []).find(x => x.id === id);
  if(n){ n.text = text; saveNotes(); }
}
function deleteNote(g, id){
  NOTES[g.id] = (NOTES[g.id] || []).filter(x => x.id !== id);
  if(!NOTES[g.id].length) delete NOTES[g.id];
  saveNotes();
}
function exportNotes(){
  const blob = new Blob([JSON.stringify(NOTES, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'roblox-radar-notes.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importNotes(file, done){
  const r = new FileReader();
  r.onload = () => {
    try {
      const incoming = JSON.parse(r.result);
      let n = 0;
      Object.entries(incoming).forEach(([gid, list]) => {
        if(!Array.isArray(list)) return;
        const mine = NOTES[gid] || (NOTES[gid] = []);
        list.forEach(x => {
          if(x && typeof x.t === 'number' && typeof x.text === 'string' && !mine.some(m => m.id === x.id)){
            mine.push({id: x.id || (Date.now().toString(36) + n), t: x.t, text: x.text}); n++;
          }
        });
      });
      saveNotes(); done(n);
    } catch (e) { done(0); }
  };
  r.readAsText(file);
}

/* ---------- player history chart (SteamDB-style) ---------- */
const RANGES = [
  {key:'24h', ms:24*3600e3}, {key:'7d', ms:7*86400e3}, {key:'30d', ms:30*86400e3}, {key:'1y', ms:365*86400e3}, {key:'all', ms:Infinity}
];
const pad2 = n => String(n).padStart(2,'0');
function dparts(ms){
  const d = new Date(ms);
  return settings.tz === 'utc'
    ? {h:d.getUTCHours(), m:d.getUTCMinutes(), mo:d.getUTCMonth(), day:d.getUTCDate()}
    : {h:d.getHours(), m:d.getMinutes(), mo:d.getMonth(), day:d.getDate()};
}
function fmtTime(ms, withDate){
  const p = dparts(ms);
  const hm = `${pad2(p.h)}:${pad2(p.m)}${settings.tz === 'utc' ? 'Z' : ''}`;
  return withDate ? `${t('months')[p.mo]} ${p.day} ${hm}` : hm;
}
function fmtDateShort(ms){ const p = dparts(ms); return `${t('months')[p.mo]} ${p.day}`; }
function niceStep(span, target){
  const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for(const m of [1,2,2.5,5,10]) if(raw <= m*mag) return m*mag;
  return 10*mag;
}
function seriesFor(g){
  return (g.hist || []).map((v,i) => ({t: SAMPLE_MS[i], v})).filter(p => p.v != null && p.t).sort((a,b)=>a.t-b.t);
}
function pointsInRange(all, range){
  if(!all.length) return [];
  if(range.ms === Infinity) return all;
  const end = all[all.length-1].t;
  return all.filter(p => p.t >= end - range.ms);
}
function pickDefaultRange(all){
  for(const r of RANGES) if(pointsInRange(all, r).length >= 2) return r.key;
  return 'all';
}

function chartHtml(g, rangeKey){
  const all = seriesFor(g);
  const range = RANGES.find(r => r.key === rangeKey) || RANGES[RANGES.length-1];
  const pts = pointsInRange(all, range);
  const allPeak = all.length ? all.reduce((m,p) => p.v > m.v ? p : m, all[0]) : null;

  const buttons = RANGES.map(r => {
    const ok = pointsInRange(all, r).length >= 2;
    return `<button type="button" class="range-btn ${r.key === range.key ? 'on' : ''}" data-range="${r.key}" ${ok ? '' : `disabled title="${t('ch_notEnough')}"`}>${t('r_'+r.key)}</button>`;
  }).join('');

  let body;
  if(pts.length < 2){
    body = `<div class="chart-empty">${t('ch_empty')}</div>`;
    chartHtml._geom = null;
  } else {
    const W = 680, H = 200, PL = 56, PR = 14, PT = 14, PB = 28;
    const t0 = pts[0].t, t1 = pts[pts.length-1].t, span = Math.max(1, t1 - t0);
    const vals = pts.map(p => p.v);
    const vmin = Math.min(...vals), vmax = Math.max(...vals);
    const ystep = niceStep(Math.max(1, vmax - vmin) * 1.25, 4);
    let ylo = Math.floor(vmin / ystep) * ystep, yhi = Math.ceil(vmax / ystep) * ystep;
    if(ylo === yhi) yhi = ylo + ystep;
    if(ylo < 0) ylo = 0;
    const x = tt => PL + ((tt - t0) / span) * (W - PL - PR);
    const y = v => PT + (1 - (v - ylo) / (yhi - ylo)) * (H - PT - PB);

    const gaps = pts.slice(1).map((p,i) => p.t - pts[i].t).sort((a,b)=>a-b);
    const median = gaps[Math.floor(gaps.length/2)] || 1;
    const gapLimit = Math.max(median * 3, 26*3600e3);
    let line = '', area = '', segStart = null;
    pts.forEach((p, i) => {
      const broke = i > 0 && (p.t - pts[i-1].t) > gapLimit;
      if(i === 0 || broke){
        if(segStart != null) area += ` L${x(pts[i-1].t).toFixed(1)},${(H-PB).toFixed(1)} L${x(segStart).toFixed(1)},${(H-PB).toFixed(1)} Z`;
        line += ` M${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`;
        area += ` M${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`;
        segStart = p.t;
      } else {
        line += ` L${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`;
        area += ` L${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`;
      }
    });
    area += ` L${x(t1).toFixed(1)},${(H-PB).toFixed(1)} L${x(segStart).toFixed(1)},${(H-PB).toFixed(1)} Z`;

    let ygrid = '';
    for(let v = ylo; v <= yhi + 1e-9; v += ystep){
      ygrid += `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${PL-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${fmtNum(Math.round(v))}</text>`;
    }
    const withDate = span > 20*3600e3;
    const nx = 5;
    let xgrid = '';
    for(let i = 0; i <= nx; i++){
      const tt = t0 + span * i / nx;
      const anchor = i === 0 ? 'start' : i === nx ? 'end' : 'middle';
      xgrid += `<line x1="${x(tt).toFixed(1)}" y1="${PT}" x2="${x(tt).toFixed(1)}" y2="${H-PB}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="${x(tt).toFixed(1)}" y="${H-9}" text-anchor="${anchor}" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${span > 3*86400e3 ? fmtDateShort(tt) : fmtTime(tt, withDate)}</text>`;
    }
    const peak = pts.reduce((m,p) => p.v > m.v ? p : m, pts[0]);
    const last = pts[pts.length-1];
    const peakLabelX = Math.min(Math.max(x(peak.t), PL + 60), W - PR - 60);
    const notes = notesFor(g).filter(n => n.t >= t0 && n.t <= t1);
    const markers = notes.map((n, i) => {
      const nx = x(n.t), ly = PT + 22 + (i % 3) * 12;
      const label = n.text.length > 26 ? n.text.slice(0, 25) + '…' : n.text;
      const anchor = nx > W - 120 ? 'end' : 'start', dx = nx > W - 120 ? -5 : 5;
      return `<g class="marker" data-note="${n.id}">
        <line x1="${nx.toFixed(1)}" y1="${PT}" x2="${nx.toFixed(1)}" y2="${H-PB}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".9"/>
        <circle cx="${nx.toFixed(1)}" cy="${H-PB}" r="4" fill="var(--warn)"/>
        <text x="${(nx + dx).toFixed(1)}" y="${ly}" text-anchor="${anchor}" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--warn)">${esc(label)}</text>
      </g>`;
    }).join('');
    body = `<div class="chart-wrap" id="chartWrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ch_title')}" id="chartSvg">
        ${ygrid}${xgrid}
        <path d="${area.trim()}" fill="color-mix(in srgb, var(--accent) 18%, transparent)" stroke="none"/>
        <path d="${line.trim()}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="${x(peak.t).toFixed(1)}" y1="${y(peak.v).toFixed(1)}" x2="${x(peak.t).toFixed(1)}" y2="${PT}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="${x(peak.t).toFixed(1)}" cy="${y(peak.v).toFixed(1)}" r="4" fill="var(--warn)"/>
        <text x="${peakLabelX.toFixed(1)}" y="${PT+9}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--warn)">${t('ch_peakLbl')} ${fmtFull(peak.v)}</text>
        <circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="var(--accent)"/>
        <line id="chartCursor" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="var(--text-dim)" stroke-width="1" visibility="hidden"/>
        <circle id="chartDot" cx="0" cy="0" r="4" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" visibility="hidden"/>
        <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${H-PT-PB}" fill="transparent" id="chartHit"/>
        ${markers}
      </svg>
      <div class="chart-tip" id="chartTip" hidden></div>
      <div class="note-form" id="noteForm" hidden></div>
    </div>`;
    chartHtml._geom = {pts, W, H, PL, PR, PT, PB, t0, span, x, y};
  }

  const avg = pts.length ? Math.round(pts.reduce((s,p)=>s+p.v,0)/pts.length) : null;
  const lo = pts.length ? Math.min(...pts.map(p=>p.v)) : null;
  const hi = pts.length ? Math.max(...pts.map(p=>p.v)) : null;
  const covered = all.length ? Math.round((all[all.length-1].t - all[0].t)/3600e3) : 0;

  return `
    <div class="chart-head">
      <span class="t">${t('ch_title')}</span>
      <div class="range-bar" id="rangeBar">${buttons}</div>
    </div>
    <div class="chart-stats">
      <div>${t('ch_now')} <b>${fmtFull(g.playing)}</b></div>
      <div>${t('ch_peak')} <b class="peak">${hi != null ? fmtFull(hi) : '—'}</b></div>
      <div>${t('ch_low')} <b>${lo != null ? fmtFull(lo) : '—'}</b></div>
      <div>${t('ch_avg')} <b>${avg != null ? fmtFull(avg) : '—'}</b></div>
      <div>${t('ch_allPeak')} <b class="peak">${allPeak ? fmtFull(allPeak.v) : '—'}</b>${allPeak ? ` <span>· ${fmtTime(allPeak.t, true)}</span>` : ''}</div>
    </div>
    ${body}
    <div class="chart-note">${t('ch_note')(all.length, covered < 1 ? t('underHour') : t('hours')(covered))}</div>
    <div class="notes-head">
      <span class="t">${t('n_title')} (${notesFor(g).length})</span>
      <div class="tools">
        <button type="button" id="notesExport">${t('n_export')}</button>
        <label for="notesImport">${t('n_import')}</label><input type="file" id="notesImport" accept="application/json" hidden>
      </div>
    </div>
    <div class="notes-list" id="notesList">
      ${notesFor(g).length ? notesFor(g).map(n => `<div class="note-item" data-note="${n.id}">
          <span class="when">${fmtTime(n.t, true)}</span><span class="txt">${esc(n.text)}</span>
          ${n.shared ? `<span class="shared">${t('n_shared')}</span>` : `<button type="button" data-edit="${n.id}">${t('n_edit')}</button><button type="button" data-del="${n.id}">${t('n_delete')}</button>`}
        </div>`).join('') : `<div class="notes-hint">${t('n_empty')}</div>`}
    </div>
    <div class="notes-hint">${t('n_hint')}</div>`;
}

function openNoteForm(g, tMs, existing){
  const wrap = document.getElementById('chartWrap');
  const form = document.getElementById('noteForm');
  const geom = chartHtml._geom;
  if(!wrap || !form || !geom) return;
  const svg = document.getElementById('chartSvg');
  const r = svg.getBoundingClientRect();
  const px = geom.x(tMs) * r.width / geom.W;
  form.innerHTML = `<span class="when">${fmtTime(tMs, true)}</span>
    <input type="text" id="noteText" maxlength="140" placeholder="${t('n_placeholder')}" value="${existing ? esc(existing.text) : ''}">
    <button type="button" class="primary" id="noteSave">${t('n_save')}</button>
    <button type="button" id="noteCancel">${t('n_cancel')}</button>`;
  form.hidden = false;
  form.style.left = Math.max(4, Math.min(px, r.width - 340)) + 'px';
  form.style.top = '8px';
  const input = document.getElementById('noteText');
  input.focus();
  const close = () => { form.hidden = true; form.innerHTML = ''; };
  const save = () => {
    const text = input.value.trim();
    if(!text){ close(); return; }
    if(existing) updateNote(g, existing.id, text); else addNote(g, tMs, text);
    renderChart(g, currentRange);
  };
  document.getElementById('noteSave').addEventListener('click', save);
  document.getElementById('noteCancel').addEventListener('click', close);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') save(); if(e.key === 'Escape'){ e.stopPropagation(); close(); } });
}

function bindNotes(g){
  const svg = document.getElementById('chartSvg');
  const geom = chartHtml._geom;
  if(svg && geom){
    svg.addEventListener('click', e => {
      const marker = e.target.closest('.marker');
      if(marker){
        const n = notesFor(g).find(x => x.id === marker.dataset.note);
        if(n && !n.shared) openNoteForm(g, n.t, n);
        return;
      }
      if(!e.target.closest('#chartHit')) return;
      const r = svg.getBoundingClientRect();
      const sx = (e.clientX - r.left) * geom.W / r.width;
      let tMs = geom.t0 + ((sx - geom.PL) / (geom.W - geom.PL - geom.PR)) * geom.span;
      tMs = Math.max(geom.t0, Math.min(geom.t0 + geom.span, Math.round(tMs / 60000) * 60000));
      openNoteForm(g, tMs, null);
    });
  }
  const list = document.getElementById('notesList');
  if(list) list.addEventListener('click', e => {
    const del = e.target.closest('[data-del]'), ed = e.target.closest('[data-edit]');
    if(del){ deleteNote(g, del.dataset.del); renderChart(g, currentRange); }
    if(ed){ const n = notesFor(g).find(x => x.id === ed.dataset.edit); if(n) openNoteForm(g, n.t, n); }
  });
  const ex = document.getElementById('notesExport');
  if(ex) ex.addEventListener('click', exportNotes);
  const im = document.getElementById('notesImport');
  if(im) im.addEventListener('change', () => { if(im.files[0]) importNotes(im.files[0], n => { renderChart(g, currentRange); }); });
}

function bindChartHover(){
  const geom = chartHtml._geom;
  const svg = document.getElementById('chartSvg');
  if(!geom || !svg) return;
  const tip = document.getElementById('chartTip');
  const cursor = document.getElementById('chartCursor');
  const dot = document.getElementById('chartDot');
  const wrap = document.getElementById('chartWrap');
  const move = e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * geom.W / r.width;
    const tt = geom.t0 + ((sx - geom.PL) / (geom.W - geom.PL - geom.PR)) * geom.span;
    let best = geom.pts[0];
    for(const p of geom.pts) if(Math.abs(p.t - tt) < Math.abs(best.t - tt)) best = p;
    const px = geom.x(best.t), py = geom.y(best.v);
    cursor.setAttribute('x1', px); cursor.setAttribute('x2', px); cursor.setAttribute('visibility','visible');
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('visibility','visible');
    tip.innerHTML = `${fmtTime(best.t, true)}<br><b>${fmtFull(best.v)}</b> ${t('players')}`;
    tip.hidden = false;
    tip.style.left = (px * r.width / geom.W) + 'px';
    tip.style.top = (py * r.height / geom.H) + 'px';
  };
  const leave = () => { tip.hidden = true; cursor.setAttribute('visibility','hidden'); dot.setAttribute('visibility','hidden'); };
  wrap.addEventListener('mousemove', move);
  wrap.addEventListener('mouseleave', leave);
  wrap.addEventListener('touchstart', e => move(e.touches[0]), {passive:true});
  wrap.addEventListener('touchmove', e => move(e.touches[0]), {passive:true});
}

let currentGame = null, currentRange = 'all';
function renderChart(g, rangeKey){
  const box = document.getElementById('chartBox');
  if(!box) return;
  currentGame = g; currentRange = rangeKey;
  box.innerHTML = chartHtml(g, rangeKey);
  bindChartHover();
  bindNotes(g);
  box.querySelectorAll('.range-btn').forEach(b => b.addEventListener('click', () => renderChart(g, b.dataset.range)));
}

function setView(v){
  view = v;

  document.getElementById('gamesView').hidden = v !== 'games';

  marketBy = b.dataset.v;
  document.querySelectorAll('#marketBy button').forEach(x => x.classList.toggle('on', x === b));
  renderMarket();
}));

function median(arr){
  const a = arr.filter(v => v != null).sort((x,y) => x-y);
  if(!a.length) return null;
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
function marketGroups(){
  const total = GAMES.reduce((s,g) => s + (g.playing||0), 0);
  const groups = [];
  const mk = (key, label, games, kind) => {
    if(!games.length) return;
    const players = games.reduce((s,g) => s + (g.playing||0), 0);
    groups.push({
      key, label, kind, n: games.length, players, share: total ? players/total*100 : 0,
      new30: games.filter(g => g.age != null && g.age < 30).length,
      new90: games.filter(g => g.age != null && g.age < 90).length,
      medPlayers: median(games.map(g => g.playing)),
      medRating: median(games.map(g => g.like)),
      d7: median(games.map(g => g.d7)),
      score: median(games.map(g => g.score))
    });
  };
  if(marketBy === 'tags'){
    const tags = [...new Set(GAMES.flatMap(g => g.tags))];
    tags.forEach(k => mk(k, tagLabel(k), GAMES.filter(g => g.tags.includes(k)), 'tag'));
    mk('__none', t('noTag'), GAMES.filter(g => !g.tags.length), 'none');
  } else {
    const cats = [...new Set(GAMES.map(g => g.cat))];
    cats.forEach(c => mk(c, catLabel(c), GAMES.filter(g => g.cat === c), 'cat'));
  }
  groups.sort((a,b) => b.players - a.players);
  return {groups, total};
}
function renderMarket(){
  if(!GAMES.length) return;
  const {groups, total} = marketGroups();
  const maxShare = Math.max(...groups.map(g => g.share), 1);
  document.getElementById('mhead').innerHTML = `<tr>
    <th>${t('m_group')}</th><th style="text-align:right">${t('m_games')}</th><th style="text-align:right">${t('m_players')}</th>
    <th>${t('m_share')}</th><th style="text-align:right">${t('m_new30')}</th><th style="text-align:right">${t('m_new90')}</th>
    <th style="text-align:right">${t('m_median')}</th><th style="text-align:right">${t('m_rating')}</th>
    <th style="text-align:right">${t('m_d7')}</th><th style="text-align:right">${t('m_score')}</th></tr>`;
  const rows = groups.map(g => `<tr data-kind="${g.kind}" data-key="${esc(g.key)}">
    <td><span class="market-name">${esc(g.label)}</span></td>
    <td class="num">${g.n}</td>
    <td class="num">${fmtTable(g.players)}</td>
    <td><div class="bar" title="${g.share.toFixed(1)}%"><i style="width:${(g.share/maxShare*100).toFixed(1)}%"></i></div><span class="market-sub">${g.share.toFixed(1)}%</span></td>
    <td class="num ${g.new30 ? 'age fresh' : 'age'}">${g.new30}</td>
    <td class="num age">${g.new90}</td>
    <td class="num">${g.medPlayers != null ? fmtTable(Math.round(g.medPlayers)) : '—'}</td>
    <td class="rating ${ratingClass(g.medRating)}">${g.medRating != null ? Math.round(g.medRating)+'%' : '—'}</td>
    <td class="num">${deltaHtml(g.d7)}</td>
    <td class="num">${g.score != null ? `<span class="score-pill ${scoreClass(g.score)}">${Math.round(g.score)}</span>` : '—'}</td>
  </tr>`).join('');
  document.getElementById('mbody').innerHTML = `<tr><td colspan="10" class="market-group">${t('m_all')} · ${GAMES.length} · ${fmtTable(total)}</td></tr>` + rows;
  document.querySelectorAll('#mbody tr[data-kind]').forEach(tr => tr.addEventListener('click', () => {
    state = defaultState();
    if(tr.dataset.kind === 'tag') state.tags = new Set([tr.dataset.key]);
    else if(tr.dataset.kind === 'cat') state.cat = tr.dataset.key;
    document.getElementById('search').value = '';
    document.getElementById('catSelect').value = state.cat;
    document.getElementById('ageSelect').value = '';
    document.getElementById('trendSelect').value = '';
    document.getElementById('ownerSelect').value = '';
    document.getElementById('sortSelect').value = 'playing_desc';
    setView('games');
    render();
    window.scrollTo({top: document.getElementById('gamesView').offsetTop - 12, behavior: 'smooth'});
  }));
}

/* ---------- language dropdown with flags ---------- */
const FLAGS = {
  gb: '<svg viewBox="0 0 60 42"><rect width="60" height="42" fill="#012169"/><path d="M0 0L60 42M60 0L0 42" stroke="#fff" stroke-width="8"/><path d="M0 0L60 42M60 0L0 42" stroke="#C8102E" stroke-width="3"/><path d="M30 0V42M0 21H60" stroke="#fff" stroke-width="12"/><path d="M30 0V42M0 21H60" stroke="#C8102E" stroke-width="7"/></svg>',
  es: '<svg viewBox="0 0 60 42"><rect width="60" height="42" fill="#AA151B"/><rect y="10.5" width="60" height="21" fill="#F1BF00"/></svg>',
  br: '<svg viewBox="0 0 60 42"><rect width="60" height="42" fill="#009C3B"/><path d="M30 5L54 21L30 37L6 21Z" fill="#FFDF00"/><circle cx="30" cy="21" r="9" fill="#002776"/></svg>',
  fr: '<svg viewBox="0 0 60 42"><rect width="20" height="42" fill="#0055A4"/><rect x="20" width="20" height="42" fill="#fff"/><rect x="40" width="20" height="42" fill="#EF4135"/></svg>',
  de: '<svg viewBox="0 0 60 42"><rect width="60" height="14" fill="#000"/><rect y="14" width="60" height="14" fill="#DD0000"/><rect y="28" width="60" height="14" fill="#FFCE00"/></svg>',
  it: '<svg viewBox="0 0 60 42"><rect width="20" height="42" fill="#009246"/><rect x="20" width="20" height="42" fill="#fff"/><rect x="40" width="20" height="42" fill="#CE2B37"/></svg>',
  ru: '<svg viewBox="0 0 60 42"><rect width="60" height="14" fill="#fff"/><rect y="14" width="60" height="14" fill="#0039A6"/><rect y="28" width="60" height="14" fill="#D52B1E"/></svg>',
  jp: '<svg viewBox="0 0 60 42"><rect width="60" height="42" fill="#fff"/><circle cx="30" cy="21" r="12" fill="#BC002D"/></svg>'
};
const flagHtml = code => `<span class="flag" aria-hidden="true">${FLAGS[code] || ''}</span>`;
const langInfo = code => (I18N.LANGS || []).find(l => l.code === code) || {code, name: code, flag: ''};
const langMenu = document.getElementById('langMenu');
const langBtn = document.getElementById('langBtn');
function renderLangDd(){
  const cur = langInfo(settings.lang);
  langBtn.innerHTML = `${flagHtml(cur.flag)}<span>${cur.name}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
  langMenu.innerHTML = (I18N.LANGS || []).map(l =>
    `<button type="button" role="option" class="lang-item ${l.code === settings.lang ? 'on' : ''}" data-lang="${l.code}" aria-selected="${l.code === settings.lang}">${flagHtml(l.flag)}<span>${l.name}</span>${l.code === settings.lang ? '<span class="check">✓</span>' : ''}</button>`
  ).join('');
}
function toggleLangMenu(open){
  const show = open ?? langMenu.hidden;
  langMenu.hidden = !show;
  langBtn.setAttribute('aria-expanded', String(show));
  if(show) langMenu.querySelector('.lang-item.on')?.focus();
}
langBtn.addEventListener('click', () => toggleLangMenu());
langMenu.addEventListener('click', e => {
  const it = e.target.closest('[data-lang]');
  if(!it) return;
  toggleLangMenu(false);
  applySetting('lang', it.dataset.lang);
  langBtn.focus();
});
document.addEventListener('click', e => { if(!langMenu.hidden && !e.target.closest('#langDd')) toggleLangMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !langMenu.hidden){ e.stopPropagation(); toggleLangMenu(false); langBtn.focus(); } }, true);

/* ---------- accuracy disclaimer ---------- */
const DC_KEY = 'radar.dc.v1';
function renderDisclaimer(){
  document.getElementById('dcText').textContent = t('dc_text');
  document.getElementById('dcClose').textContent = t('dc_close');
  document.getElementById('footerDc').textContent = t('dc_text');
  let dismissed = false;
  try { dismissed = localStorage.getItem(DC_KEY) === '1'; } catch (e) {}
  document.getElementById('disclaimer').hidden = dismissed;
}
document.getElementById('dcClose').addEventListener('click', () => {
  try { localStorage.setItem(DC_KEY, '1'); } catch (e) {}
  document.getElementById('disclaimer').hidden = true;
});

/* ---------- settings panel ---------- */
const settingsOverlay = document.getElementById('settingsOverlay');
let settingsReturnFocus = null;
function syncSettingsUI(){
  renderLangDd();
  settingsOverlay.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.setting;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(settings[key]) === b.dataset.v));
  });
  settingsOverlay.querySelectorAll('.switch').forEach(sw => sw.setAttribute('aria-checked', String(!!settings[sw.dataset.setting])));
}
function applySetting(key, value){
  settings[key] = value;
  saveSettings();
  if(key === 'theme') applyTheme();
  if(key === 'rows'){ PAGE = value === 'all' ? Infinity : Number(value); state.shown = PAGE; }
  if(key === 'rememberFilters' && value) saveFilters();
  if(key === 'lang'){ applyLanguage(); syncSettingsUI(); return; }
  syncSettingsUI();
  if(GAMES.length) render();
  if(key === 'tz' && !overlay.hidden && currentGame) renderChart(currentGame, currentRange);
}
function openSettings(){
  settingsReturnFocus = document.activeElement;
  syncSettingsUI();
  settingsOverlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('settingsClose').focus();
}
function closeSettings(){
  settingsOverlay.hidden = true;
  if(overlay.hidden) document.body.style.overflow = '';
  if(settingsReturnFocus) settingsReturnFocus.focus();
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', e => { if(e.target === settingsOverlay) closeSettings(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !settingsOverlay.hidden) closeSettings(); });
settingsOverlay.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => applySetting(b.closest('.seg').dataset.setting, b.dataset.v)));
settingsOverlay.querySelectorAll('.switch').forEach(sw => sw.addEventListener('click', () => applySetting(sw.dataset.setting, !settings[sw.dataset.setting])));
document.getElementById('settingsReset').addEventListener('click', () => {
  settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  saveSettings();
  try { localStorage.removeItem(FILTERS_KEY); localStorage.removeItem(DC_KEY); } catch (e) {}
  applyTheme();
  PAGE = 150; state.shown = PAGE;
  applyLanguage(); syncSettingsUI();
});

/* ---------- legal panel ---------- */
const legalOverlay = document.getElementById('legalOverlay');
let legalReturnFocus = null;
function openLegal(){
  legalReturnFocus = document.activeElement;
  document.getElementById('legalContent').innerHTML = t('lg_html');
  legalOverlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('legalClose').focus();
}
function closeLegal(){
  legalOverlay.hidden = true;
  if(overlay.hidden && settingsOverlay.hidden) document.body.style.overflow = '';
  if(legalReturnFocus) legalReturnFocus.focus();
}
document.getElementById('legalBtn').addEventListener('click', openLegal);
document.getElementById('legalClose').addEventListener('click', closeLegal);
legalOverlay.addEventListener('click', e => { if(e.target === legalOverlay) closeLegal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !legalOverlay.hidden) closeLegal(); });

/* ---------- boot ---------- */
async function loadData(){
  const bust = '?v=' + Math.floor(Date.now() / 3600e3);
  const [gamesDoc, hist, shared] = await Promise.all([
    fetch('data/games.json' + bust).then(r => r.json()),
    fetch('data/history.json' + bust).then(r => r.json()),
    fetch('data/notes.json' + bust).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
  SHARED_NOTES = shared && typeof shared === 'object' ? shared : {};
  const now = Date.now();
  gamesDoc.games.forEach(g => {
    g.age = g.created ? Math.floor((now - new Date(g.created)) / 86400e3) : null;
    g.upd = g.updated ? Math.floor((now - new Date(g.updated)) / 86400e3) : null;
    g.vpd = g.age ? Math.round(g.visits / g.age) : null;
    g.hist = hist.series[String(g.id)] || [];
  });
  DATA = {generated: gamesDoc.generated, sampleTimes: hist.times || []};
  GAMES = gamesDoc.games;
  SAMPLE_TIMES = DATA.sampleTimes;
}
async function init(){
  document.getElementById('legalBtn').textContent = t('lg_link');
  applyLanguage();
  document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="loading">${t('loading')}</div></td></tr>`;
  try { await loadData(); }
  catch (e) { document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="loading">${t('loadErr')}</div></td></tr>`; return; }
  indexGames();
  loadFilters();
  applyLanguage();
}
init();
</script>
