name: Daily refresh

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 4:00 pm Caracas, Roblox peak hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live stats from Roblox
        run: python scripts/update.py

      - name: Commit updated data
        run: |
          git config user.name "roblox-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json data/history.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
