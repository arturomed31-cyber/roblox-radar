function renderCompare(){
  const box = document.getElementById('cmpBox');
  const byId = new Map(GAMES.map(g => [String(g.id), g]));
  const games = CMP.map(id => byId.get(id)).filter(Boolean);
  const ranges = RANGES.map(r => `<button type="button" class="range-btn ${r.key === cmpRange ? 'on' : ''}" data-crange="${r.key}">${t('r_'+r.key)}</button>`).join('');
  const modes = `<div class="seg"><button type="button" data-cmode="abs" class="${cmpMode === 'abs' ? 'on' : ''}">${tw('w_abs')}</button><button type="button" data-cmode="rel" class="${cmpMode === 'rel' ? 'on' : ''}">${tw('w_rel')}</button></div>`;
  let body;
  if(games.length < 1){
    body = `<div class="cmp-empty">${tw('w_cmpHint')}</div>`;
    renderCompare._geom = null;
  } else {
    const range = RANGES.find(r => r.key === cmpRange) || RANGES[RANGES.length-1];
    const series = games.map(g => pointsInRange(seriesFor(g), range));
    const end = Math.max(...series.map(s => s.length ? s[s.length-1].t : 0));
    const first = Math.min(...series.map(s => s.length ? s[0].t : Infinity));
    const start = range.ms === Infinity ? first : Math.max(end - range.ms, first);
    const rel = cmpMode === 'rel';
    const lines = series.map(s => {
      const base = s.length ? s[0].v : 1;
      return s.map(p => ({t: p.t, v: rel ? (base ? (p.v / base - 1) * 100 : 0) : p.v, raw: p.v}));
    });
    const W = 680, H = 220, PL = 56, PR = 14, PT = 14, PB = 28;
    const t0 = isFinite(start) ? start : end - 1, span = Math.max(1, end - t0);
    const vals = lines.flatMap(l => l.map(p => p.v));
    let vmin = vals.length ? Math.min(...vals) : 0, vmax = vals.length ? Math.max(...vals) : 1;
    if(rel){ vmin = Math.min(vmin, 0); vmax = Math.max(vmax, 0); }
    const ystep = niceStep(Math.max(1, vmax - vmin) * 1.25, 4);
    let ylo = Math.floor(vmin / ystep) * ystep, yhi = Math.ceil(vmax / ystep) * ystep;
    if(ylo === yhi) yhi = ylo + ystep;
    if(!rel && ylo < 0) ylo = 0;
    const x = tt => PL + ((tt - t0) / span) * (W - PL - PR);
    const y = v => PT + (1 - (v - ylo) / (yhi - ylo)) * (H - PT - PB);
    let ygrid = '';
    for(let v = ylo; v <= yhi + 1e-9; v += ystep){
      ygrid += `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="${rel && Math.abs(v) < 1e-9 ? 'var(--text-faint)' : 'var(--border)'}" stroke-width="1"/>
        <text x="${PL-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${rel ? fmtPct(v) : fmtNum(Math.round(v))}</text>`;
    }
    const withDate = span > 20*3600e3, nx = 5;
    let xgrid = '';
    for(let i = 0; i <= nx; i++){
      const tt = t0 + span * i / nx;
      xgrid += `<line x1="${x(tt).toFixed(1)}" y1="${PT}" x2="${x(tt).toFixed(1)}" y2="${H-PB}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="${x(tt).toFixed(1)}" y="${H-9}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${span > 3*86400e3 ? fmtDateShort(tt) : fmtTime(tt, withDate)}</text>`;
    }
    const paths = lines.map((l, i) => {
      if(l.length < 2) return '';
      const gaps = l.slice(1).map((p,j) => p.t - l[j].t).sort((a,b)=>a-b);
      const gapLimit = Math.max((gaps[Math.floor(gaps.length/2)] || 1) * 3, 26*3600e3);
      let d = '';
      l.forEach((p, j) => { d += (j === 0 || p.t - l[j-1].t > gapLimit ? ' M' : ' L') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1); });
      return `<path d="${d.trim()}" fill="none" stroke="${CMP_COLORS[i]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('');
    const dots = lines.map((l, i) => `<circle id="cmpDot${i}" cx="0" cy="0" r="4" fill="var(--panel)" stroke="${CMP_COLORS[i]}" stroke-width="2" visibility="hidden"/>`).join('');
    body = `<div class="chart-wrap" id="cmpWrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tw('w_cmp')}" id="cmpSvg">${ygrid}${xgrid}${paths}
        <line id="cmpCursor" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="var(--text-dim)" stroke-width="1" visibility="hidden"/>${dots}
      </svg><div class="chart-tip" id="cmpTip" hidden></div></div>
      <div class="cmp-legend">${games.map((g, i) => `<span><i style="background:${CMP_COLORS[i]}"></i>${esc(g.name.length > 34 ? g.name.slice(0,33) + '…' : g.name)}</span>`).join('')}${rel ? `<span style="color:var(--text-faint)">${tw('w_since')}</span>` : ''}</div>`;
    renderCompare._geom = {lines, W, H, PL, PR, t0, span, x, y, rel};
  }
  // side-by-side metrics
  const metrics = [
    ['st_now', g => g.playing, fmtFull, 1], ['st_peak', g => { const s = seriesFor(g); return s.length ? Math.max(...s.map(p=>p.v)) : null; }, fmtFull, 1],
    ['st_d1', g => g.d1, fmtPct, 1], ['st_d7', g => g.d7, fmtPct, 1], ['st_d30', g => g.d30, fmtPct, 1],
    ['st_rating', g => g.like, v => v == null ? '—' : v + '%', 1], ['st_visits', g => g.visits, fmtFull, 1], ['st_vpd', g => g.vpd, fmtFull, 1],
    ['st_favs', g => g.favs, fmtFull, 1], ['st_age', g => g.age, fmtAge, 0], ['st_upd', g => g.upd, fmtUpd, -1],
    ['h_score', g => g.score, v => v, 1], ['bz_rev', g => g.rev, v => v == null ? '—' : '$' + fmtFull(v) + ' ' + t('bz_perMonth'), 1],
    ['bz_members', g => g.members, fmtFull, 1], ['bz_passes', g => g.passes, v => v ?? '—', 0]
  ];
  let table = '';
  if(games.length){
    table = `<div class="cmp-table-wrap"><table class="cmp-table"><thead><tr><th>${tw('w_metric')}</th>${games.map((g, i) => `<th class="g"><i style="background:${CMP_COLORS[i]}"></i><button class="game-name" data-open="${g._i}">${esc(g.name.length > 28 ? g.name.slice(0,27) + '…' : g.name)}</button></th>`).join('')}</tr></thead><tbody>` +
      metrics.map(([k, get, fmt, dir]) => {
        const vals = games.map(get);
        const nums = vals.filter(v => typeof v === 'number');
        const best = dir && nums.length > 1 ? (dir > 0 ? Math.max(...nums) : Math.min(...nums)) : null;
        return `<tr><th>${t(k)}</th>${vals.map(v => `<td class="num ${best != null && v === best ? 'best' : ''}">${fmt(v)}</td>`).join('')}</tr>`;
      }).join('') + `</tbody></table></div>`;
  }
  box.innerHTML = `<div class="cmp-box">
    <div class="cmp-head"><span class="t">${tw('w_cmp')} <span class="market-sub">· ${tw('w_cmpMax')}</span></span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${games.length ? modes : ''}<div class="range-bar">${ranges}</div></div></div>
    ${body}${table}</div>`;
  box.querySelectorAll('[data-crange]').forEach(b => b.addEventListener('click', () => { cmpRange = b.dataset.crange; renderCompare(); }));
  box.querySelectorAll('[data-cmode]').forEach(b => b.addEventListener('click', () => { cmpMode = b.dataset.cmode; renderCompare(); }));
  box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openModal(Number(b.dataset.open))));
  bindCompareHover(games);
}
function bindCompareHover(games){
  const geom = renderCompare._geom, svg = document.getElementById('cmpSvg');
  if(!geom || !svg) return;
  const tip = document.getElementById('cmpTip'), cursor = document.getElementById('cmpCursor'), wrap = document.getElementById('cmpWrap');
  const move = e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * geom.W / r.width;
    const tt = Math.max(geom.t0, Math.min(geom.t0 + geom.span, geom.t0 + ((sx - geom.PL) / (geom.W - geom.PL - geom.PR)) * geom.span));
    let rows = '', px = geom.x(tt), py = null;
    geom.lines.forEach((l, i) => {
      const dot = document.getElementById('cmpDot' + i);
      if(!l.length){ dot.setAttribute('visibility', 'hidden'); return; }
      let best = l[0];
      for(const p of l) if(Math.abs(p.t - tt) < Math.abs(best.t - tt)) best = p;
      const near = Math.abs(best.t - tt) < geom.span / 8;
      dot.setAttribute('cx', geom.x(best.t)); dot.setAttribute('cy', geom.y(best.v)); dot.setAttribute('visibility', near ? 'visible' : 'hidden');
      if(near){ if(py == null) py = geom.y(best.v); rows += `<span style="color:${CMP_COLORS[i]}">■</span> ${esc(games[i].name.slice(0, 22))}: <b>${fmtFull(best.raw)}</b>${geom.rel ? ` (${fmtPct(best.v)})` : ''}<br>`; }
    });
    cursor.setAttribute('x1', px); cursor.setAttribute('x2', px); cursor.setAttribute('visibility', 'visible');
    tip.innerHTML = fmtTime(tt, true) + '<br>' + rows;
    tip.hidden = !rows;
    tip.style.left = (px * r.width / geom.W) + 'px';
    tip.style.top = ((py ?? 30) * r.height / geom.H) + 'px';
  };
  const leave = () => { tip.hidden = true; cursor.setAttribute('visibility', 'hidden'); geom.lines.forEach((_, i) => document.getElementById('cmpDot' + i).setAttribute('visibility', 'hidden')); };
  wrap.addEventListener('mousemove', move);
  wrap.addEventListener('mouseleave', leave);
  wrap.addEventListener('touchstart', e => move(e.touches[0]), {passive:true});
  wrap.addEventListener('touchmove', e => move(e.touches[0]), {passive:true});
}

async function liveFetch(id){
  const r = await fetch(`${WORKER_URL.replace(/\/$/, '')}/live?ids=${id}`, {cache: 'no-store'});
  if(!r.ok) throw new Error('relay ' + r.status);
  const d = await r.json();
  return d.games && d.games[String(id)];
}
function liveApply(g, d){
  if(!d) return;
  for(const k of ['playing', 'visits', 'favs', 'like', 'votes']) if(d[k] != null) g[k] = d[k];
  if(currentGame && currentGame.id === g.id){
    const set = (k, v) => { const el = modal.querySelector(`.stat[data-k="${k}"] .v`); if(el) el.textContent = v; };
    set('now', fmtFull(g.playing)); set('visits', fmtFull(g.visits)); set('rating', g.like != null ? g.like + '%' : '—');
    set('votes', fmtFull(g.votes)); set('favs', fmtFull(g.favs));
  }
}
async function liveTick(id){
  const L = LIVE.get(String(id)); if(!L) return;
  const g = GAMES.find(x => String(x.id) === String(id)); if(!g) return;
  try {
    const d = await liveFetch(id);
    if(d && d.playing != null){
      L.samples.push({t: Date.now(), v: d.playing});
      if(L.samples.length > 2000) L.samples.shift();
      L.last = Date.now(); L.err = false;
      liveApply(g, d);
      tickerUpdate(g);
    }
  } catch (e) { L.err = true; }
  if(L.until && Date.now() >= L.until) liveStop(id, true);
  if(currentGame && currentGame.id === g.id) renderLive(g);
}
function liveStart(g, every, dur){
  liveStop(g.id);
  const L = {every, startAt: Date.now(), until: dur ? Date.now() + dur * 1000 : 0, samples: [], last: 0, err: false, done: false};
  L.timer = setInterval(() => liveTick(g.id), every * 1000);
  LIVE.set(String(g.id), L);
  liveTick(g.id);
  renderLive(g);
  buildTicker();
}
function liveStop(id, finished){
  const L = LIVE.get(String(id)); if(!L) return;
  clearInterval(L.timer); L.timer = null; L.done = !!finished;
  if(!finished) LIVE.delete(String(id));
}
function liveSpark(samples){
  if(samples.length < 2) return '';
  const W = 680, H = 90, PL = 46, PR = 8, PT = 8, PB = 18;
  const t0 = samples[0].t, t1 = samples[samples.length - 1].t, span = Math.max(1, t1 - t0);
  const vs = samples.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), rng = Math.max(1, hi - lo);
  const x = tt => PL + (tt - t0) / span * (W - PL - PR), y = v => PT + (1 - (v - lo) / rng) * (H - PT - PB);
  const d = samples.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
  const last = samples[samples.length - 1];
  return `<svg class="live-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <line x1="${PL}" y1="${PT}" x2="${W - PR}" y2="${PT}" stroke="var(--border)"/><line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="var(--border)"/>
    <text x="${PL - 6}" y="${PT + 4}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${fmtNum(hi)}</text>
    <text x="${PL - 6}" y="${H - PB + 4}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${fmtNum(lo)}</text>
    <text x="${PL}" y="${H - 5}" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${hhmmss(t0)}</text>
    <text x="${W - PR}" y="${H - 5}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--text-faint)">${hhmmss(t1)}</text>
    <path d="${d}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="var(--good)"/>
  </svg>`;
}
function renderLive(g){
  const box = document.getElementById('liveBox'); if(!box) return;
  const L = LIVE.get(String(g.id));
  const running = !!(L && L.timer);
  box.classList.toggle('on', running);
  const every = L ? L.every : (renderLive.every || 30), dur = L ? (L.until ? Math.round((L.until - (L.startAt || Date.now())) / 1000) : 0) : (renderLive.dur ?? 600);
  const ctrl = running
    ? `<button type="button" class="stop" id="liveBtn">${tl('stop')}</button>`
    : `<span class="lbl">${tl('every')}</span><select id="liveEvery">${LIVE_EVERY.map(([v, l]) => `<option value="${v}" ${v === every ? 'selected' : ''}>${l}</option>`).join('')}</select>
       <span class="lbl">${tl('for')}</span><select id="liveFor">${LIVE_FOR.map(([v, l]) => `<option value="${v}" ${v === dur ? 'selected' : ''}>${l}</option>`).join('')}</select>
       <button type="button" id="liveBtn" ${WORKER_URL ? '' : 'disabled'}>${tl('start')}</button>`;
  let body = '';
  if(!WORKER_URL) body = `<div class="live-status">${tl('needs')}</div>`;
  else if(L && L.samples.length){
    const vs = L.samples.map(p => p.v), first = vs[0], last = vs[vs.length - 1];
    const delta = last - first, dp = first ? Math.round(delta / first * 100) : 0;
    body = `<div class="live-stats">
      <div>${tl('now')} <b class="big">${fmtFull(last)}</b></div>
      <div>${tl('since')} <b class="${delta > 0 ? 'pos' : delta < 0 ? 'neg' : ''}" style="color:${delta > 0 ? 'var(--good)' : delta < 0 ? 'var(--risk)' : 'inherit'}">${delta > 0 ? '+' : ''}${fmtFull(delta)} (${dp > 0 ? '+' : ''}${dp}%)</b></div>
      <div>${tl('min')} <b>${fmtFull(Math.min(...vs))}</b></div><div>${tl('max')} <b>${fmtFull(Math.max(...vs))}</b></div>
      <div><b>${vs.length}</b> ${tl('n')}</div><div>${tl('last')} <b>${hhmmss(L.last)}</b></div>
    </div>${liveSpark(L.samples)}
    <div class="live-status ${L.err ? 'err' : ''}">${L.err ? tl('err') : running ? (L.until ? `${tl('stopsAt')} ${hhmmss(L.until)}` : tl('forever')) : tl('done')}</div>`;
  } else if(L && L.err) body = `<div class="live-status err">${tl('err')}</div>`;
  box.innerHTML = `<div class="score-head"><div><div class="t"><span class="dot"></span>${tl('title')}</div><div class="hint">${tl('hint')}</div></div><div class="live-ctrl">${ctrl}</div></div>${body}`;
  const btn = document.getElementById('liveBtn');
  if(btn) btn.addEventListener('click', () => {
    if(running){ liveStop(g.id); renderLive(g); return; }
    renderLive.every = Number(document.getElementById('liveEvery').value);
    renderLive.dur = Number(document.getElementById('liveFor').value);
    liveStart(g, renderLive.every, renderLive.dur);
  });
}

/* ---------- heartbeat behind the title (rising = green, falling = red) ---------- */
function pulsePoints(){
  // one beat per top game, in ticker order: rising games spike up, falling games dip down, size ∝ 24 h change
  const rows = GAMES.length ? [...GAMES].sort((a,b) => (b.playing||0) - (a.playing||0)).slice(0, 24).filter(g => g.d1 != null) : [];
  if(rows.length < 6) return [[0,80],[70,80],[82,72],[94,80],[150,80],[162,18],[174,112],[186,80],[260,80],[272,74],[284,80],[360,80],[372,40],[384,104],[396,80],
    [470,80],[486,70],[500,80],[560,80],[572,26],[584,110],[596,80],[660,80],[672,74],[684,80],[760,80],[772,44],[784,102],[796,80],[900,80]];
  const step = 900 / rows.length, pts = [[0,80]];
  rows.forEach((g, i) => {
    const x0 = i * step, amp = Math.min(60, 8 + Math.abs(g.d1) * 1.2);       // 8–60 px of amplitude
    const dir = g.d1 >= 0 ? -1 : 1;                                            // SVG y grows downwards
    pts.push([x0 + step*0.35, 80], [x0 + step*0.5, 80 + dir*amp], [x0 + step*0.62, 80 - dir*amp*0.25], [x0 + step*0.72, 80]);
  });
  pts.push([900,80]);
  return pts;
}
function buildPulse(){
  const pts = pulsePoints();
  const all = pts.concat(pts.slice(1).map(([x,y]) => [x + 900, y]));   // two copies for a seamless loop
  const d = {flat:'', up:'', down:''};
  for(let i = 1; i < all.length; i++){
    const [x0,y0] = all[i-1], [x1,y1] = all[i];
    const k = y1 < y0 ? 'up' : y1 > y0 ? 'down' : 'flat';   // SVG y grows downwards
    d[k] += `M${x0},${y0}L${x1},${y1}`;
  }
  document.getElementById('pulseFlat').setAttribute('d', d.flat);
  document.getElementById('pulseUp').setAttribute('d', d.up);
  document.getElementById('pulseDown').setAttribute('d', d.down);
}
buildPulse();

/* ---------- ticker: top games with their 24 h change, scrolling like a market tape ---------- */
function buildTicker(){
  const el = document.getElementById('ticker'), track = document.getElementById('tickerTrack');
  if(!GAMES.length) return;
  const rows = [...GAMES].sort((a,b) => (b.playing||0) - (a.playing||0)).slice(0, 40);
  const item = g => {
    const c = g.d1, cls = c == null ? 'flat' : c >= 1 ? 'up' : c <= -1 ? 'down' : 'flat';
    const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '•';
    return `<span class="tk" data-open="${g._i}"><span class="nm">${esc(g.name)}</span><span class="v" data-tk="${g.id}">${fmtNum(g.playing)}</span><span class="ch ${cls}">${arrow} ${c == null ? '—' : fmtPct(c)}</span>${LIVE.get(String(g.id))?.timer ? '<span class="live"></span>' : ''}</span>`;
  };
  const html = rows.map(item).join('');
  track.innerHTML = html + html;   // duplicated for a seamless loop
  el.hidden = false;
  tickerRun();
}
// JS-driven scroll so hovering eases to a stop and back instead of freezing
const TK = {x: 0, v: 0, target: 40, raf: 0, last: 0};   // px per second
function tickerRun(){
  const el = document.getElementById('ticker'), track = document.getElementById('tickerTrack');
  if(TK.raf || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.addEventListener('mouseenter', () => { TK.target = 0; });
  el.addEventListener('mouseleave', () => { TK.target = 40; });
  el.addEventListener('touchstart', () => { TK.target = TK.target ? 0 : 40; }, {passive: true});
  const step = now => {
    const dt = Math.min(0.05, (now - (TK.last || now)) / 1000); TK.last = now;
    TK.v += (TK.target - TK.v) * Math.min(1, dt * 4);          // ease toward the target speed
    TK.x -= TK.v * dt;
    const half = track.scrollWidth / 2;
    if(half && TK.x <= -half) TK.x += half;
    track.style.transform = `translateX(${TK.x.toFixed(2)}px)`;
    TK.raf = requestAnimationFrame(step);
  };
  TK.raf = requestAnimationFrame(step);
}
function tickerUpdate(g){
  document.querySelectorAll(`[data-tk="${g.id}"]`).forEach(v => {
    const nv = fmtNum(g.playing);
    if(v.textContent !== nv){ v.textContent = nv; v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump'); }
  });
}
document.getElementById('tickerTrack').addEventListener('click', e => {
  const t = e.target.closest('[data-open]'); if(t) openModal(Number(t.dataset.open));
});

const tst = k => (STUDIO_I18N[settings.lang] || STUDIO_I18N.en)[k] ?? STUDIO_I18N.en[k];
const ST = {search:'', min:2, owner:'', sort:'players', shown:60, open:new Set()};
let STUDIOS = null;
function buildStudios(){
  const by = new Map();
  GAMES.forEach(g => {
    const key = g.cUrl || ('name:' + g.creator);
    let s = by.get(key);
    if(!s){ s = {key, name:g.creator || t('unknown'), type:g.cType, url:g.cUrl, verified:!!g.verified, games:[]}; by.set(key, s); }
    s.games.push(g);
    if(g.verified) s.verified = true;
  });
  const total = GAMES.reduce((a,g) => a + (g.playing||0), 0);
  const list = [...by.values()].map(s => {
    s.games.sort((a,b) => (b.playing||0) - (a.playing||0));
    s.n = s.games.length;
    s.players = s.games.reduce((a,g) => a + (g.playing||0), 0);
    s.share = total ? s.players / total * 100 : 0;
    s.top = s.games[0];
    s.conc = s.players ? (s.top.playing||0) / s.players * 100 : 100;
    // 7d change weighted by players: compare the summed current count with the summed count a week ago
    let cur = 0, prev = 0;
    s.games.forEach(g => { if(g.d7 != null && g.playing){ cur += g.playing; prev += g.playing / (1 + g.d7/100); } });
    s.d7 = prev > 0 ? (cur / prev - 1) * 100 : null;
    const rated = s.games.filter(g => g.like != null && g.playing);
    s.rating = rated.length ? Math.round(rated.reduce((a,g) => a + g.like * g.playing, 0) / rated.reduce((a,g) => a + g.playing, 0)) : null;
    s.rev = s.games.some(g => g.rev != null) ? s.games.reduce((a,g) => a + (g.rev||0), 0) : null;
    s.score = Math.max(...s.games.map(g => g.score||0));
    s.members = (s.games.find(g => g.grp && g.grp.m != null) || {grp:{m:null}}).grp.m;
    s.newest = Math.min(...s.games.map(g => g.age ?? Infinity));
    s.search = (s.name + ' ' + s.games.map(g => g.name).join(' ')).toLowerCase();
    return s;
  });
  return list;
}

function studioRows(){
  let rows = STUDIOS.filter(s => s.n >= ST.min);
  if(ST.owner) rows = rows.filter(s => s.type === ST.owner);
  if(ST.search){ const q = ST.search.toLowerCase(); rows = rows.filter(s => s.search.includes(q)); }
  const miss = -Infinity;
  const key = {players:s=>s.players, games:s=>s.n, d7:s=>s.d7 ?? miss, rev:s=>s.rev ?? miss, members:s=>s.members ?? miss, conc:s=>-s.conc, new:s=>-(s.newest === Infinity ? 1e9 : s.newest)}[ST.sort] || (s=>s.players);
  return rows.sort((a,b) => key(b) - key(a) || b.players - a.players);
}

  const maxShare = Math.max(...rows.map(s => s.share), 0.01);
  body.innerHTML = rows.slice(0, ST.shown).map(s => {
    const open = ST.open.has(s.key);
    const topName = s.top.name.length > 34 ? s.top.name.slice(0,33) + '…' : s.top.name;
    return `<tr class="st ${open ? 'open' : ''}" data-key="${esc(s.key)}">
      <td><span class="chev">▶</span></td>
      <td><div class="studio-name"><span>${esc(s.name)}${s.verified ? ' ✓' : ''}</span><span class="kind ${s.type === 'Group' ? 'group' : ''}">${s.type === 'Group' ? tst('s_group_tag') : tst('s_user_tag')}</span></div>
        <div class="studio-sub">${s.members != null ? fmtTable(s.members) + ' ' + tst('s_members') : ''}</div></td>
      <td class="num">${s.n}</td>
      <td class="num">${fmtTable(s.players)}</td>
      <td><div class="bar" title="${s.share.toFixed(2)}%"><i style="width:${(s.share/maxShare*100).toFixed(1)}%"></i></div><span class="market-sub">${s.share < 0.1 ? '<0.1' : s.share.toFixed(1)}%</span></td>
      <td class="studio-top"><button class="game-name" data-open="${s.top._i}">${esc(topName)}</button><div class="conc">${Math.round(s.conc)}% ${tst('s_of')}</div></td>
      <td class="num">${deltaHtml(s.d7)}</td>
      <td class="rating ${ratingClass(s.rating)}">${s.rating != null ? s.rating + '%' : '—'}</td>
      <td class="num">${s.rev != null ? '$' + fmtNum(s.rev) : '—'}</td>
      <td class="num"><span class="score-pill ${scoreClass(s.score)}">${s.score}</span></td>
    </tr>${open ? studioGamesHtml(s) : ''}`;
  }).join('');
  const more = document.getElementById('stMoreRow');
  more.hidden = rows.length <= ST.shown;
  document.getElementById('stMoreBtn').textContent = tst('s_more')(Math.min(60, rows.length - ST.shown));
}

function buildUrl(gameId){
  const q = new URLSearchParams();
  if(gameId) q.set('game', gameId);
  if(state.search) q.set('q', state.search);
  if(state.cat) q.set('cat', state.cat);
  if(state.age) q.set('age', state.age);
  if(state.trend) q.set('trend', state.trend);
  if(state.owner) q.set('owner', state.owner);
  if(state.tags.size) q.set('tags', [...state.tags].join(','));
  if(state.sort !== 'playing_desc') q.set('sort', state.sort);
  if(view === 'market') q.set('view', 'market');
  if(view === 'watch'){ q.set('view', 'watch'); if(WATCH.size) q.set('watch', [...WATCH].join(',')); }
  if(view === 'studios'){
    q.set('view', 'studios');
    if(ST.search) q.set('sq', ST.search); if(ST.min !== 2) q.set('smin', ST.min);
    if(ST.owner) q.set('sowner', ST.owner); if(ST.sort !== 'players') q.set('ssort', ST.sort);
  }
  const qs = q.toString();
  return location.origin + location.pathname + (qs ? '?' + qs : '');
}
function syncUrl(){
  const u = buildUrl(currentGame ? currentGame.id : null);
  if(u !== location.href) history.replaceState(null, '', u);
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  if(btn){ const old = btn.textContent; btn.textContent = ts('copied'); btn.classList.add('done'); setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1600); }
}
function applyUrlState(){
  const q = new URLSearchParams(location.search);
  if(!q.toString()) return null;
  state.search = q.get('q') || ''; state.cat = q.get('cat') || ''; state.age = q.get('age') || '';
  state.trend = q.get('trend') || ''; state.owner = q.get('owner') || '';
  state.tags = new Set((q.get('tags') || '').split(',').filter(Boolean));
  if(q.get('sort')) state.sort = q.get('sort');
  if(q.get('view') === 'market') view = 'market';
  if(q.get('view') === 'studios'){
    view = 'studios';
    ST.search = q.get('sq') || ''; ST.min = Number(q.get('smin') || 2) || 1;
    ST.owner = q.get('sowner') || ''; ST.sort = q.get('ssort') || 'players';
  }
  if(q.get('view') === 'watch'){
    view = 'watch';
    (q.get('watch') || '').split(',').filter(Boolean).forEach(id => WATCH.add(String(id)));
    saveWatch();
  }
  return q.get('game');
}

    `<button type="button" role="option" class="lang-item ${l.code === settings.lang ? 'on' : ''}" data-lang="${l.code}" aria-selected="${l.code === settings.lang}">${flagHtml(l.flag)}<span>${l.name}</span>${l.code === settings.lang ? '<span class="check">✓</span>' : ''}</button>`
  ).join('');
}
function toggleLangMenu(open){
  const show = open ?? langMenu.hidden;
  langMenu.hidden = !show;
  langBtn.setAttribute('aria-expanded', String(show));
  if(show) langMenu.querySelector('.lang-item.on')?.focus();
}
langBtn.addEventListener('click', () => toggleLangMenu());
langMenu.addEventListener('click', e => {
  const it = e.target.closest('[data-lang]');
  if(!it) return;
  toggleLangMenu(false);
  applySetting('lang', it.dataset.lang);
  langBtn.focus();
});
document.addEventListener('click', e => { if(!langMenu.hidden && !e.target.closest('#langDd')) toggleLangMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !langMenu.hidden){ e.stopPropagation(); toggleLangMenu(false); langBtn.focus(); } }, true);

/* ---------- accuracy disclaimer ---------- */
const DC_KEY = 'radar.dc.v1';
function renderDisclaimer(){
  document.getElementById('dcText').textContent = t('dc_text');
  document.getElementById('dcClose').textContent = t('dc_close');
  document.getElementById('footerDc').textContent = t('dc_text');
  let dismissed = false;
  try { dismissed = localStorage.getItem(DC_KEY) === '1'; } catch (e) {}
  document.getElementById('disclaimer').hidden = dismissed;
}
document.getElementById('dcClose').addEventListener('click', () => {
  try { localStorage.setItem(DC_KEY, '1'); } catch (e) {}
  document.getElementById('disclaimer').hidden = true;
});

/* ---------- settings panel ---------- */
const settingsOverlay = document.getElementById('settingsOverlay');
let settingsReturnFocus = null;
function syncSettingsUI(){
  renderLangDd();
  settingsOverlay.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.setting;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(settings[key]) === b.dataset.v));
  });
  settingsOverlay.querySelectorAll('.switch').forEach(sw => sw.setAttribute('aria-checked', String(!!settings[sw.dataset.setting])));
}
function applySetting(key, value){
  settings[key] = value;
  saveSettings();
  if(key === 'theme') applyTheme();
  if(key === 'rows'){ PAGE = value === 'all' ? Infinity : Number(value); state.shown = PAGE; }
  if(key === 'rememberFilters' && value) saveFilters();
  if(key === 'lang'){ applyLanguage(); syncSettingsUI(); return; }
  syncSettingsUI();
  if(GAMES.length) render();
  if(key === 'tz' && !overlay.hidden && currentGame) renderChart(currentGame, currentRange);
}
function openSettings(){
  settingsReturnFocus = document.activeElement;
  syncSettingsUI();
  settingsOverlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('settingsClose').focus();
}
function closeSettings(){
  settingsOverlay.hidden = true;
  if(overlay.hidden) document.body.style.overflow = '';
  if(settingsReturnFocus) settingsReturnFocus.focus();
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', e => { if(e.target === settingsOverlay) closeSettings(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !settingsOverlay.hidden) closeSettings(); });
settingsOverlay.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => applySetting(b.closest('.seg').dataset.setting, b.dataset.v)));
settingsOverlay.querySelectorAll('.switch').forEach(sw => sw.addEventListener('click', () => applySetting(sw.dataset.setting, !settings[sw.dataset.setting])));
document.getElementById('settingsReset').addEventListener('click', () => {
  settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  saveSettings();
  try { localStorage.removeItem(FILTERS_KEY); localStorage.removeItem(DC_KEY); } catch (e) {}
  applyTheme();
  PAGE = 150; state.shown = PAGE;
  applyLanguage(); syncSettingsUI();
});

/* ---------- legal panel ---------- */
const legalOverlay = document.getElementById('legalOverlay');
let legalReturnFocus = null;
function openLegal(){
  legalReturnFocus = document.activeElement;
  document.getElementById('legalContent').innerHTML = t('lg_html');
  legalOverlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('legalClose').focus();
}
function closeLegal(){
  legalOverlay.hidden = true;
  if(overlay.hidden && settingsOverlay.hidden) document.body.style.overflow = '';
  if(legalReturnFocus) legalReturnFocus.focus();
}
document.getElementById('legalBtn').addEventListener('click', openLegal);

/* ---------- "how it's calculated" ---------- */
const tm = k => ((I18N.METHOD || {})[settings.lang] || I18N.METHOD.en)[k];
const methodOverlay = document.getElementById('methodOverlay');
let methodReturnFocus = null;
function openMethod(){
  methodReturnFocus = document.activeElement;
  document.getElementById('methodTitleText').textContent = tm('title');
  document.getElementById('methodContent').innerHTML = tm('html');
  methodOverlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('methodClose').focus();
}
function closeMethod(){
  methodOverlay.hidden = true;
  if(overlay.hidden && settingsOverlay.hidden && legalOverlay.hidden) document.body.style.overflow = '';
  if(methodReturnFocus) methodReturnFocus.focus();
}
document.getElementById('methodBtn').addEventListener('click', openMethod);
document.getElementById('methodClose').addEventListener('click', closeMethod);
methodOverlay.addEventListener('click', e => { if(e.target === methodOverlay) closeMethod(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !methodOverlay.hidden){ e.stopPropagation(); closeMethod(); } }, true);
modal.addEventListener('click', e => { if(e.target.closest('[data-method]')) openMethod(); });
document.getElementById('legalClose').addEventListener('click', closeLegal);
legalOverlay.addEventListener('click', e => { if(e.target === legalOverlay) closeLegal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !legalOverlay.hidden) closeLegal(); });

/* ---------- boot ---------- */
async function loadData(){
  const bust = '?v=' + Math.floor(Date.now() / 3600e3);
  const [gamesDoc, hist, shared, biz] = await Promise.all([
    fetch('data/games.json' + bust).then(r => r.json()),
    fetch('data/history.json' + bust).then(r => r.json()),
    fetch('data/notes.json' + bust).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('data/business.json' + bust).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
  SHARED_NOTES = shared && typeof shared === 'object' ? shared : {};
  const BIZ = biz && typeof biz === 'object' ? biz : {};
  const now = Date.now();
  gamesDoc.games.forEach(g => {
    // business data (groups, passes, social links) lives in its own file
    const b = BIZ[String(g.id)];
    if (b) {
      for (const k of ['gp', 'grp', 'vip', 'paid', 'enrichedAt']) if (b[k] !== undefined) g[k] = b[k];
      if (Array.isArray(b.socials) && b.socials.length) g.socials = b.socials;
    }
    g.age = g.created ? Math.floor((now - new Date(g.created)) / 86400e3) : null;
    g.upd = g.updated ? Math.floor((now - new Date(g.updated)) / 86400e3) : null;
    g.vpd = g.age ? Math.round(g.visits / g.age) : null;
    g.hist = hist.series[String(g.id)] || [];
  });
  DATA = {generated: gamesDoc.generated, sampleTimes: hist.times || []};
  GAMES = gamesDoc.games;
  SAMPLE_TIMES = DATA.sampleTimes;
}
async function init(){
  document.getElementById('legalBtn').textContent = t('lg_link');
  document.getElementById('methodBtn').textContent = tm('link');
  applyLanguage();
  document.getElementById('tbody').innerHTML = Array.from({length: 8}, () =>
    `<tr><td colspan="7" style="padding:0"><div class="skel"><i class="ico"></i><div><i class="w1"></i><i class="w2"></i></div><i class="w3"></i><i class="num"></i><i class="num"></i></div></td></tr>`).join('');
  try { await loadData(); }
  catch (e) { document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="loading">${t('loadErr')}</div></td></tr>`; return; }
  indexGames();
  loadFilters();
  const gameFromUrl = applyUrlState();
  applyLanguage();
  if(view !== 'games') setView(view);
  if(gameFromUrl){
    const g = GAMES.find(x => String(x.id) === String(gameFromUrl));
    if(g) openModal(g._i);
  }
}
init();
</script>
