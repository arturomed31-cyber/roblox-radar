name: Daily refresh

on:
  schedule:
    - cron: "20 20 * * *"   # 20:00 UTC = 4:00 pm Caracas, Roblox peak hours
  workflow_dispatch:
    inputs:
      min_players:
        description: "Minimum concurrent players for newly discovered games"
        default: "100"
        required: false
      pages:
        description: "Search pages per keyword (each page = 40 results)"
        default: "1"
        required: false
      skip_discovery:
        description: "Skip discovery, only refresh stats"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover new games (100+ players, 1 page per keyword)
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        run: python scripts/discover.py --min-players "${{ github.event.inputs.min_players || '100' }}" --pages "${{ github.event.inputs.pages || '1' }}" --no-groups
        continue-on-error: true

      - name: Pull live stats from Roblox (votes, images)
        run: python scripts/update.py

      - name: Discord alerts
        run: python scripts/alerts.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "roblox-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json data/history.json data/trends.json data/overrides.json data/alerts_state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
